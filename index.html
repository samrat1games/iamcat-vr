<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I am Cat VR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 16px system-ui, sans-serif; }
  canvas { display: block; touch-action: none; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #start { position: fixed; inset: 0; z-index: 5; overflow: hidden; background: #2a1a10; }
  #start .bg { position: absolute; inset: -6%; background: url(assets/logo.png) center / cover; filter: blur(26px) brightness(.8); }
  #start img { position: absolute; left: 50%; top: 0; height: calc(100% - 150px); max-width: 100%; transform: translateX(-50%); object-fit: contain; }
  #start .btns { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; background: linear-gradient(transparent, #0008 40%); }
  #start button { font-size: 20px; padding: 14px 24px; border-radius: 14px; border: 0; min-width: 280px; cursor: pointer; }
  #start .note { flex-basis: 100%; text-align: center; opacity: .75; font-size: 12px; text-shadow: 0 1px 3px #000; }
  #status { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 18px; z-index: 2; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #help { position: fixed; left: 8px; bottom: 8px; font-size: 12px; opacity: .75; z-index: 2; pointer-events: none; text-shadow: 0 1px 3px #000; max-width: 45vw; }
  #cross { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid #fff8; border-radius: 50%; z-index: 2; pointer-events: none; display: none; }
  #rot { position: fixed; inset: 0; z-index: 20; background: #2a1a10; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; gap: 14px; text-align: center; }
  #rot i { font-size: 64px; font-style: normal; display: inline-block; animation: rt 1.6s ease-in-out infinite; }
  @keyframes rt { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { #rot { display: flex; } }
  #cam { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="start" style="display:none">
  <div class="bg"></div><img src="assets/logo.png" alt="I am Cat">
  <div class="btns">
    <button id="goVr" style="background:#9ad1ff">📱 Cardboard — телефон + гироскоп</button>
  </div>
</div>
<div id="rot"><i>📱</i>Поверни телефон горизонтально<br><small style="font-size:14px;opacity:.7">вставь его в Cardboard</small></div>
<div id="status"></div><div id="cross"></div>
<video id="cam" playsinline muted></video>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
const params = new URLSearchParams(location.search);
const tick0 = () => new Promise(r => setTimeout(r));   // отдать кадр браузеру между тяжёлыми шагами загрузки
const EMB = window.EMBED || {};                          // файлы, вшитые в html (tools/embed.py); без них — грузим по сети из assets/
const embBytes = url => { const b = EMB[url]; if (!b) return null; const s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; };
const assetUrl = url => EMB[url] ? 'data:' + (url.endsWith('.png') ? 'image/png' : 'application/octet-stream') + ';base64,' + EMB[url] : url;
let MODE = null;                                       // 'pc' | 'vr'
let PHASE = 'menu';                                    // 'menu' → 'load' (экран загрузки) → 'play'
let loadProgress = 0;

/* ---------- Renderer, камеры «головы» (общие для экрана загрузки и игры) ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9b48a, 1.6));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.4);
sun.position.set(2.5, 5, 3); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, far: 16 });
scene.add(sun, sun.target);

const head = new THREE.Group(); scene.add(head);       // «тело» камеры: на нём гироскоп / мышь
const IPD = 0.064;
const camC = new THREE.PerspectiveCamera(75, 1, 0.05, 80);           // ПК: одна камера
const camL = new THREE.PerspectiveCamera(80, 1, 0.05, 80), camR = camL.clone();   // Cardboard: две
camL.position.x = -IPD / 2; camR.position.x = IPD / 2;
head.add(camC, camL, camR);

/* Линзы Cardboard: каждый глаз рисуем в текстуру и выводим через бочкообразную дисторсию (r' = r·(1 + k1·r² + k2·r⁴)), чтобы линзы шлема вернули прямые линии */
const LENS = { k1: 0.22, k2: 0.24 };
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const lensRT = new THREE.WebGLRenderTarget(2, 2, { samples: IOS ? 0 : 4 }); lensRT.texture.colorSpace = THREE.SRGBColorSpace;
const lensMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: lensRT.texture }, k1: { value: LENS.k1 }, k2: { value: LENS.k2 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D t; uniform float k1, k2; varying vec2 vUv;
    void main(){
      vec2 e = vec2(fract(vUv.x * 2.), vUv.y); vec2 p = (e - .5) * 2.; float r2 = dot(p, p) * .5, s = 1. + .5 * k1 + .25 * k2;
      vec2 q = p * (1. + k1 * r2 + k2 * r2 * r2) / s;
      gl_FragColor = (abs(q.x) > 1. || abs(q.y) > 1.) ? vec4(0., 0., 0., 1.) : texture2D(t, vec2((q.x * .5 + .5 + (vUv.x < .5 ? 0. : 1.)) * .5, q.y * .5 + .5));
      #include <colorspace_fragment>
    }`, depthTest: false, depthWrite: false
});
const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat); lensQuad.frustumCulled = false;
const lensScene = new THREE.Scene(), lensCam = new THREE.Camera(); lensScene.add(lensQuad);

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h);
  lensRT.setSize(Math.round(w * renderer.getPixelRatio()), Math.round(h * renderer.getPixelRatio()));
  camC.aspect = w / h; camL.aspect = camR.aspect = (w / 2) / h;
  camC.updateProjectionMatrix(); camL.updateProjectionMatrix(); camR.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function render(sc) {
  const w = innerWidth, h = innerHeight;
  head.updateMatrixWorld(true);
  if (MODE === 'vr') {                                          // Stereo split-screen: левый и правый глаз
    const W = lensRT.width, H = lensRT.height, hw = W >> 1;
    renderer.setRenderTarget(lensRT); lensRT.scissorTest = true;
    for (const [cam, x0] of [[camL, 0], [camR, hw]]) { lensRT.viewport.set(x0, 0, hw, H); lensRT.scissor.set(x0, 0, hw, H); renderer.render(sc, cam); }
    renderer.setRenderTarget(null); renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); renderer.render(lensScene, lensCam);
  } else { renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); renderer.render(sc, camC); }
}

/* ---------- Управление взглядом: мышь / стрелки / гироскоп (нужно и на экране загрузки) ---------- */
let yaw = 0, pitch = 0, spaceHeld = false, mouseDown = false, autoWalk = false;
const keys = new Set();
const _e = new THREE.Euler(0, 0, 0, 'YXZ');
addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') { spaceHeld = true; e.preventDefault(); } if (e.code === 'KeyR') location.reload(); });
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Space') spaceHeld = false; });
addEventListener('mousemove', e => {
  if (MODE !== 'pc') return;
  if (PHASE === 'play' && document.pointerLockElement !== renderer.domElement) return;
  if (PHASE === 'load' && !(e.buttons & 1)) return;                // на экране загрузки крутим зажатой кнопкой
  yaw -= e.movementX * 0.0022; pitch = THREE.MathUtils.clamp(pitch - e.movementY * 0.0022, -1.4, 1.4);
});

const gyro = { alpha: 0, beta: 0, gamma: 0, active: false, yawOffset: 0 };
const _q = new THREE.Quaternion(), _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), _z = new THREE.Vector3(0, 0, 1);
function applyGyro() {
  const d = THREE.MathUtils.degToRad, orient = d((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  _e.set(d(gyro.beta), d(gyro.alpha) + gyro.yawOffset, -d(gyro.gamma), 'YXZ');
  head.quaternion.setFromEuler(_e).multiply(_q1).multiply(_q.setFromAxisAngle(_z, -orient));
}
let gyroHooked = false;
async function initGyro() {
  if (DeviceOrientationEvent.requestPermission && await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('гироскоп запрещён');
  if (gyroHooked) return; gyroHooked = true;
  addEventListener('deviceorientation', e => {
    if (e.alpha == null) return;
    if (!gyro.active) { gyro.active = true; gyro.yawOffset = -THREE.MathUtils.degToRad(e.alpha); }
    gyro.alpha = e.alpha; gyro.beta = e.beta; gyro.gamma = e.gamma;
  });
}
const updateLook = () => { if (MODE === 'pc') head.quaternion.setFromEuler(_e.set(pitch, yaw, 0, 'YXZ')); else if (gyro.active) applyGyro(); };

/* ---------- Экран загрузки: логотип на весь экран + размытое «продолжение» вокруг, можно крутить головой ---------- */
const loadScene = new THREE.Scene();
const loadUI = { bar: null, logo: null };
const logoImg = new Image(); logoImg.src = assetUrl('assets/logo.png');
const logoReady = logoImg.decode().then(() => true, () => false);
function blurred(src, w, h) {                           // размытая копия картинки (ctx.filter нет в Safari — там даунсэмпл + апсэмпл)
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h }), x = c.getContext('2d');
  if ('filter' in x) { x.filter = `blur(${Math.round(w / 60)}px)`; x.drawImage(src, 0, 0, w, h); return c; }
  let cur = src, k = 16;
  while (k >= 1) { const s = Object.assign(document.createElement('canvas'), { width: Math.max(2, w / k | 0), height: Math.max(2, h / k | 0) }); s.getContext('2d').drawImage(cur, 0, 0, s.width, s.height); cur = s; k /= 2; }
  x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, w, h); return c;
}
async function buildLoadScene() {
  if (!await logoReady) { loadScene.background = new THREE.Color(0x2a1a10); }
  else {
    const W = 2048, H = 1024, pano = Object.assign(document.createElement('canvas'), { width: W, height: H }), p = pano.getContext('2d');
    const tile = Object.assign(document.createElement('canvas'), { width: 1024, height: 1024 });   // картинка на половину панорамы, зеркально — без швов
    const tx = tile.getContext('2d'); tx.drawImage(logoImg, 0, 0, 1024, 1024);
    const soft = blurred(tile, 1024, 1024);
    p.drawImage(soft, 1024, 0);                                        // спереди (−Z): продолжение логотипа
    p.save(); p.translate(1024, 0); p.scale(-1, 1); p.drawImage(soft, 0, 0); p.restore();   // сзади — отражение
    const panoTex = new THREE.CanvasTexture(pano); panoTex.colorSpace = THREE.SRGBColorSpace;
    loadScene.add(new THREE.Mesh(new THREE.SphereGeometry(30, 48, 24), new THREE.MeshBasicMaterial({ map: panoTex, side: THREE.BackSide })));
    // резкий логотип с мягкими краями поверх размытого фона
    const lc = Object.assign(document.createElement('canvas'), { width: 1024, height: 1024 }), lx = lc.getContext('2d');
    lx.drawImage(logoImg, 0, 0, 1024, 1024);
    const m = lx.createRadialGradient(512, 512, 330, 512, 512, 512); m.addColorStop(0, '#fff'); m.addColorStop(1, '#fff0');
    lx.globalCompositeOperation = 'destination-in'; lx.fillStyle = m; lx.fillRect(0, 0, 1024, 1024);
    const lt = new THREE.CanvasTexture(lc); lt.colorSpace = THREE.SRGBColorSpace;
    const logo = loadUI.logo = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), new THREE.MeshBasicMaterial({ map: lt, transparent: true }));
    logo.position.set(0, 0.1, -3.2); loadScene.add(logo);
  }
  const barBg = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.07), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
  barBg.position.set(0, -1.75, -3.1); loadScene.add(barBg);
  const bar = loadUI.bar = new THREE.Mesh(new THREE.PlaneGeometry(2.16, 0.045), new THREE.MeshBasicMaterial({ color: 0xffb347 }));
  bar.geometry.translate(1.08, 0, 0); bar.position.set(-1.08, -1.75, -3.09); bar.scale.x = 0.001; loadScene.add(bar);
}
const loadReady = buildLoadScene();

/* ---------- Вход: кнопки, права на гироскоп/камеру (только по клику!) ---------- */
let enterResolve; const entered = new Promise(r => { enterResolve = r; });
let handsPromise = null, camState = 'ожидание', camBusy = false;
function startCam() {                                    // камера после гироскопа: iOS показывает окна разрешений по одному
  if (camBusy || camState === 'ok') return handsPromise;
  camBusy = true; camState = 'запрос…';
  return handsPromise = initHands().then(() => { camState = 'ok'; }, e => { camState = (e.message || e) + ' — тапни экран, чтобы повторить'; status('камера: ' + camState); }).finally(() => { camBusy = false; });
}
let gyroBusy = false;
function sensors() {                                     // гироскоп первым, потом камера: iOS показывает окна разрешений по одному
  const g = gyro.active || gyroBusy ? Promise.resolve() : (gyroBusy = true, initGyro().catch(e => console.warn('гироскоп:', e.message || e)).finally(() => { gyroBusy = false; }));
  if (!params.has('test')) g.finally(() => startCam());
}
addEventListener('pointerdown', () => { if (MODE === 'vr' && (!gyro.active || camState !== 'ok')) sensors(); });
let warns = '';
function enter(mode) {
  MODE = mode; PHASE = 'load'; $('start').remove();
  head.position.set(0, 0, 0); head.quaternion.identity();
  renderer.setAnimationLoop(() => { if (PHASE === 'load') loadTick(); else tick(); });
  const warn = t => { console.warn(t); status(t); };
  sensors();                                                       // Android — сразу; iOS требует тап (см. pointerdown)
  Promise.resolve().then(() => document.documentElement.requestFullscreen?.()).catch(() => {});
  screen.orientation?.lock?.('landscape').catch(() => {}); navigator.wakeLock?.request('screen').catch(() => {});
  setInterval(() => { if (!gyro.active) status('Тапни экран — включить гироскоп и камеру'); else if ($('status').textContent.startsWith('Тапни')) status(''); }, 600);
  enterResolve();
}
function loadTick() {
  if (PHASE !== 'load') return;
  updateLook();
  if (loadUI.bar) loadUI.bar.scale.x = Math.max(0.001, loadProgress);
  render(loadScene);
}
enter('vr');

/* ---------- Физика и модели: грузим пока человек смотрит на логотип ---------- */
status('');
const RAPIER = (await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js')).default;
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
const dynamic = [], kinds = new Map(), home = new Map();
const stdMat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const gltfLoader = new GLTFLoader();
const loadGLB = async (url, w) => {
  const buf = embBytes(url);
  if (buf) { await tick0(); return gltfLoader.parseAsync(buf, ''); }
  return new Promise((res, rej) => gltfLoader.load(url, res, e => { if (e.total) loadProgress = Math.max(loadProgress, w[0] + w[1] * e.loaded / e.total); }, rej));
};
const stage = (n, text) => { status(text); loadProgress = Math.max(loadProgress, n); return tick0(); };
await loadReady;

function addBody(mesh, desc, pos, kind = 'item') {
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(...pos).setLinearDamping(0.3).setAngularDamping(0.8));
  world.createCollider(desc.setRestitution(0.25).setFriction(0.8).setDensity(300), body);
  mesh.position.set(...pos); mesh.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(mesh);
  body.sleep();                                          // стоят на местах, пока их не тронут (иначе пересечения с полками выталкивают их сквозь пол)
  dynamic.push({ mesh, body }); kinds.set(body.handle, kind); home.set(body.handle, new THREE.Vector3(...pos));
  return body;
}

/* ---------- Дом из Unity (assets/house/house.glb собран tools/build_house.py) ---------- */
await stage(0.02, 'Загружаю дом…');
const houseGltf = await loadGLB('assets/house/house.glb', [0.02, 0.5]);
const house = houseGltf.scene; scene.add(house);
house.traverse(o => { if (o.isMesh) { o.receiveShadow = true; if (o.material.map) o.material.map.anisotropy = 4; } });
await stage(0.55, 'Строю стены и пол…');
const staticHandles = new Set();
{
  house.updateMatrixWorld(true);
  const v = [], idx = [], p = new THREE.Vector3();
  house.traverse(m => {
    if (!m.isMesh) return;
    const g = m.geometry, pos = g.attributes.position, base = v.length / 3;
    for (let i = 0; i < pos.count; i++) { p.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld); v.push(p.x, p.y, p.z); }
    if (g.index) for (const i of g.index.array) idx.push(base + i); else for (let i = 0; i < pos.count; i++) idx.push(base + i);
  });
  const col = world.createCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(v), new Uint32Array(idx)).setFriction(0.8));
  staticHandles.add(col.handle);
}
const isStatic = c => staticHandles.has(c.handle);
const _q0 = { x: 0, y: 0, z: 0, w: 1 }, ray = new RAPIER.Ray({ x: 0, y: 0, z: 0 }, { x: 0, y: -1, z: 0 });
const balls = new Map();
const hitStatic = (x, y, z, r) => world.intersectionWithShape({ x, y, z }, _q0, balls.get(r) ?? balls.set(r, new RAPIER.Ball(r)).get(r), undefined, undefined, undefined, undefined, isStatic) !== null;
function groundAt(x, z, fromY, up = false) {              // высота пола под (x, z); fromY — откуда смотрим вниз (чтобы не вставать на столы)
  ray.origin.x = x; ray.origin.y = fromY; ray.origin.z = z; ray.dir.y = up ? 1 : -1;
  const h = world.castRay(ray, up ? 9 : 4, true, undefined, undefined, undefined, undefined, isStatic);
  if (!h) return null; const d = h.timeOfImpact ?? h.toi;
  return fromY + (up ? d : -d);
}

/* ---------- Предметы: из того же дома (props.glb), у каждого свой динамический коллайдер ---------- */
await stage(0.6, 'Расставляю предметы…');
const propsGltf = await loadGLB('assets/house/props.glb', [0.6, 0.15]);
const propMeta = (EMB['assets/house/house.json'] ? JSON.parse(atob(EMB['assets/house/house.json'])) : await (await fetch('assets/house/house.json')).json()).props;
{
  const byId = new Map();
  propsGltf.scene.traverse(o => { if (!o.isMesh) return; const m = /^p(\d+)_/.exec(o.name) || (o.parent && /^p(\d+)_/.exec(o.parent.name)); if (m) { (byId.get(m[1]) ?? byId.set(m[1], []).get(m[1])).push(o); } });
  const box = new THREE.Box3(), c = new THREE.Vector3(), sz = new THREE.Vector3(), pt = new THREE.Vector3();
  for (const [id, meshes] of byId) {
    box.makeEmpty(); meshes.forEach(m => { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); });
    box.getCenter(c); box.getSize(sz);
    if (Math.max(sz.x, sz.y, sz.z) < 0.01 || Math.max(sz.x, sz.y, sz.z) > 1.2) continue;
    const pts = [];
    for (const m of meshes) { const pos = m.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 120)); for (let i = 0; i < pos.count; i += step) { pt.fromBufferAttribute(pos, i).sub(c); pts.push(pt.x, pt.y, pt.z); } }
    const group = new THREE.Group();
    meshes.forEach(m => { m.removeFromParent(); m.position.set(-c.x, -c.y, -c.z); group.add(m); });
    const name = propMeta['p' + id] || '';
    const kind = /^Cup_/.test(name) ? 'cup' : /^Vase/.test(name) ? 'vase' : /^Cat/.test(name) ? 'statue' : /^(Tomato|Potato|Carrot|Eggplant|Сucumber|Chili|Bread)/.test(name) ? 'fruit' : 'item';
    const desc = RAPIER.ColliderDesc.convexHull(new Float32Array(pts)) ?? RAPIER.ColliderDesc.cuboid(sz.x / 2, sz.y / 2, sz.z / 2);
    addBody(group, desc, [c.x, c.y + 0.003, c.z], kind);
  }
}

/* ---------- Бабушка (модель Unity без скелета; запасной вариант — из примитивов) ---------- */
await stage(0.78, 'Бабушка идёт…');
const GLB = {};

    h.pinching = h.wasPinch ? pinchDist < 0.6 : pinchDist < 0.35; h.wasPinch = h.pinching;
    landmarkToHead(l[9], palm, h.target); h.target.x *= 1.4; h.target.y *= 1.6;
    handOrient(l, h);   // лапа достаёт дальше руки — чтобы дотянуться до пола
  });
  for (const h of hands) if (!h.active) h.wasPinch = false;
}
function updatePaw() {
  for (const h of hands) {
    if (!h.active) h.target.set(h.side * 0.1, -0.12, -0.5);   // нет руки в кадре — лапа в позе покоя
    h.paw.position.lerp(h.target, 0.5);
    h.paw.quaternion.slerp(h.active && h.targetQ ? h.targetQ : h.restQ, 0.35);
  }
}

/* ---------- Улетевшее за пределы дома возвращаем на место ---------- */
function keepInBounds() {
  for (const { body } of dynamic) {
    if (body === held) continue;
    const t = body.translation();
    if (t.y < -2 || Math.abs(t.x) > 40 || Math.abs(t.z) > 40) {
      body.setTranslation(home.get(body.handle), true); body.setLinvel({ x: 0, y: 0, z: 0 }, true); body.setAngvel({ x: 0, y: 0, z: 0 }, true);
    }
  }
}

/* ---------- Физика: шаг, лапа, захват ---------- */
const clock = new THREE.Clock();
function stepPhysics(dt) {
  world.timestep = dt;
  for (const h of hands) {
    h.col.setEnabled(h !== heldBy);
    h.paw.updateWorldMatrix(true, false);
    h.wprev.copy(h.w); h.paw.getWorldPosition(h.w);
    if (!h.wInit) { h.wprev.copy(h.w); h.wInit = true; }
    h.pv.lerp(_vel.copy(h.w).sub(h.wprev).divideScalar(dt), 0.3);
    h.body.setNextKinematicTranslation(h.w);
  }
  if (!held) {
    for (const h of hands) {
      if (!(h.active && h.pinching)) continue;
      let best = 0.2;                                         // берём ближайший предмет в радиусе 0.2 м
      for (const { body } of dynamic) { const t = body.translation(), d = Math.hypot(t.x - h.w.x, t.y - h.w.y, t.z - h.w.z); if (d < best) { best = d; held = body; heldBy = h; } }
      if (held) {
        const t = held.translation(); holdOffset.set(t.x - h.w.x, t.y - h.w.y, t.z - h.w.z);
        held.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased, true); status('держу предмет'); break;
      }
    }
  } else if (!(heldBy.active && heldBy.pinching)) {           // отпустили: бросок со скоростью лапы
    held.setBodyType(RAPIER.RigidBodyType.Dynamic, true); held.setCcdEnabled(true);
    held.setLinvel(heldBy.pv.clampLength(0, 6), true);
    held = heldBy = null; status('');
  }
  if (held) held.setNextKinematicTranslation({ x: heldBy.w.x + holdOffset.x, y: heldBy.w.y + holdOffset.y, z: heldBy.w.z + holdOffset.z });
  world.step();
  for (const { mesh, body } of dynamic) {
    const t = body.translation(), r = body.rotation();
    mesh.position.set(t.x, t.y, t.z); mesh.quaternion.set(r.x, r.y, r.z, r.w);
  }
  keepInBounds();
}

/* ---------- Главный цикл ---------- */
let HELP = '', lastHud = 0;
function tick() {
  if (PHASE !== 'play') return;
  const dt = THREE.MathUtils.clamp(clock.getDelta(), 1 / 240, 1 / 30);
  updateLook();
  walk(dt); updateHands(); updatePaw(); armLoco(dt); updateGranny(dt); stepPhysics(dt);
  sun.position.set(head.position.x + 2.5, head.position.y + 5, head.position.z + 3); sun.target.position.copy(head.position);
  render(scene);
}
window.__tick = tick; window.__dbg = { head, granny, hands, armLoco, moveHead, get lift() { return lift; }, world, scene, house, nav, reach, gs, dynamic, setView: (y, p) => { yaw = y; pitch = p; }, walkable: cellWalkable, hitStatic, groundAt, pickTarget, updateGranny };

/* ---------- Конец загрузки → игра ---------- */
loadProgress = 1; status('');
await entered;                                          // игрок мог ещё не выбрать режим — ждём
await new Promise(r => setTimeout(r, params.has('test') ? 0 : 900));   // дать увидеть заполненную полоску
{
  let best = null, bd = 1e9;                            // старт кота: просторная клетка (рядом нет мебели) ближе всего к гостиной
  for (const [i, j] of reach) { const d = Math.hypot(i * CELL - 4, j * CELL - 0.5); if (d < bd && Math.hypot(i * CELL - granny.position.x, j * CELL - granny.position.z) > 2.5 && !hitStatic(i * CELL, 0.55, j * CELL, 0.4)) { bd = d; best = [i, j]; } }
  const [si, sj] = best || nav.start;
  head.position.set(si * CELL, EYE, sj * CELL); baseY = EYE; floorY = 0; yaw = 0; pitch = 0; head.quaternion.identity();
}
PHASE = 'play';
if (MODE === 'pc') {
  renderer.shadowMap.enabled = true; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  $('cross').style.display = 'block';
  $('help').textContent = 'Клик — захват мыши · WASD — ходить · Shift — бежать · мышь/стрелки — смотреть · ЛКМ/пробел — взять · колесо — дальность лапы · R — заново';
} else {
  HELP = 'Две руки перед камерой · лапой на пол и оттолкнись — поедешь, как в Gorilla Tag · щипок — взять предмет';
  renderer.shadowMap.enabled = true; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
}
clock.getDelta();
navigator.serviceWorker?.register('sw.js').catch(() => {});
</script>
